	<!-- Скрипт для видео (без развертывания) -->
	<script>
		document.addEventListener( 'DOMContentLoaded', () => {
			const cards = document.querySelectorAll( '.video-card' );

			cards.forEach( card => {
				const preview = card.querySelector( '.video-preview' );
				const player = card.querySelector( '.video-player' );
				const playBtn = card.querySelector( '.play-btn' );
				const youtubeId = card.getAttribute( 'data-video' );

				if ( !youtubeId ) return;

				let isPlaying = false;

				// Запуск видео
				function startVideo() {
					if ( isPlaying ) return;

					const iframe = document.createElement( 'iframe' );
					// Добавляем параметры для скрытия лишнего мусора и автовоспроизведения
					iframe.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
					iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
					iframe.allowFullscreen = true;
					iframe.title = 'Свадебное видео';

					player.appendChild( iframe );
					player.hidden = false;

					card.classList.add( 'is-playing' );
					isPlaying = true;
				}

				// События
				playBtn?.addEventListener( 'click', startVideo );
				preview?.addEventListener( 'click', startVideo );
			} );
		} );
	</script>
